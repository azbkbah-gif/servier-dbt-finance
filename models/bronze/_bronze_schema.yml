version: 2

# Déclaration de la source brute Airbyte
sources:
  - name: raw_sap
    schema: raw_sap_ingestion
    tables:
      - name: cskt

# Déclaration de tes modèles de transformation (Bronze)
models:
  - name: bz_sap_bkpf
    columns:
      - name: bkpf_pk
        data_tests:
          - unique
          - not_null
      - name: code_societe
        data_tests:
          - not_null
      - name: date_comptable
        data_tests:
          - not_null

  - name: bz_sap_bseg
    columns:
      - name: bseg_pk
        data_tests:
          - unique
          - not_null
      - name: sens_sh
        data_tests:
          - accepted_values:
              arguments:
                values: ['S', 'H']
              config:
                where: "sens_sh IS NOT NULL"

  - name: bz_sap_cskt
    description: "Table Bronze des textes des centres de coûts SAP (CSKT)"
    columns:
      - name: KOSTL
        description: "Code du centre de coût"
        data_tests:
          - not_null
      - name: SPRAS
        description: "Code langue converti (F = Français, E = Anglais)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'E']