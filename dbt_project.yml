# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'servier_dbt_finance'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'servier_finance'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: 'target'
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  servier_dbt_finance:
    bronze:
      +schema: bronze_sap
      +materialized: view          # Bronze = vue légère
      +tags: ['bronze', 'sap']
      
    silver:
      +schema: silver_finance
      +materialized: table         # Silver = table physique
      +tags: ['silver']
      
    gold:
      +schema: gold_finance
      +materialized: table         # Gold = table physique
      +tags: ['gold']
      
      # Sous-dossiers spécifiques du niveau Gold
      comptabilite:
        +tags: ['gold', 'comptabilite', 'power_bi']
      achats:
        +tags: ['gold', 'achats', 'power_bi']
      ventes:
        +tags: ['gold', 'ventes', 'power_bi']
      tresorerie:
        +tags: ['gold', 'tresorerie', 'power_bi']
      budget:
        +tags: ['gold', 'budget', 'power_bi']